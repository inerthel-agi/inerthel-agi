<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title description">
  <title id="title">inerthel-agi operator ID</title>
  <desc id="description">Neo-brutalist operator card for inerthel-agi with an abstract Stealthy signal mark and personal status panels.</desc>
  <defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.4" fill="#111111" opacity=".15" /></pattern></defs>
  <style>.display{font-family:Impact,Haettenschweiler,"Arial Black","DejaVu Sans Condensed",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.outline{stroke:#111;stroke-width:6;stroke-linejoin:miter}.label{font-size:17px;font-weight:900;letter-spacing:1px}.value{font-size:21px;font-weight:900}</style>
  <rect width="900" height="430" fill="#FFF7E8"/><rect width="900" height="430" fill="url(#dots)"/><rect x="27" y="27" width="852" height="382" fill="#111"/><rect x="16" y="16" width="852" height="382" fill="#FFF7E8" class="outline"/>
  <rect x="16" y="16" width="852" height="52" fill="#FFD84D" class="outline"/><text x="39" y="50" class="mono label" fill="#111">OPERATOR_ID://001</text><circle cx="757" cy="42" r="10" fill="#A8FF60" stroke="#111" stroke-width="4"/><text x="778" y="49" class="mono label" fill="#111">VERIFIED</text>
  <g id="stealthy-signal-mark">
    <rect x="57" y="106" width="254" height="254" fill="#111"/><rect x="45" y="94" width="254" height="254" fill="#5BE7FF" class="outline"/><rect x="65" y="114" width="214" height="190" fill="#FFF7E8" class="outline"/>
    <text x="80" y="143" class="mono label">SIGNAL://LIVE</text><circle cx="244" cy="136" r="7" fill="#A8FF60" stroke="#111" stroke-width="4"/>
    <path d="M84 237H119V181H153V266H191V199H226V237H260" fill="none" stroke="#FF6B6B" stroke-width="19" stroke-linejoin="miter"/><path d="M77 230H112V174H146V259H184V192H219V230H253" fill="none" stroke="#111" stroke-width="19" stroke-linejoin="miter"/>
    <rect x="65" y="315" width="214" height="33" fill="#FFD84D" class="outline"/><text x="82" y="339" class="mono label">STEALTHY SIGNAL</text>
  </g>
  <rect x="338" y="94" width="182" height="36" fill="#5BE7FF" class="outline"/><text x="354" y="119" class="mono label" fill="#111">QUIET TOOLMAKER</text>
  <text x="346" y="199" class="display" font-size="55" letter-spacing="-1" fill="#FF6B6B">inerthel-agi</text><text x="338" y="191" class="display" font-size="55" letter-spacing="-1" fill="#111">inerthel-agi</text><text x="342" y="223" class="mono label" fill="#111">@inerthel-agi // HUMAN IN THE LOOP</text>
  <g class="mono"><rect x="338" y="247" width="242" height="62" fill="#FFD84D" class="outline"/><text x="353" y="272" class="label">BASE</text><text x="353" y="296" class="value">PARIS / LOCALHOST</text><rect x="596" y="247" width="246" height="62" fill="#FF6B6B" class="outline"/><text x="611" y="272" class="label">MODE</text><text x="611" y="296" class="value">LOCAL-FIRST</text></g>
  <g class="mono"><rect x="338" y="325" width="242" height="53" fill="#5BE7FF" class="outline"/><text x="353" y="348" class="label">FOCUS</text><text x="353" y="369" class="value">AI × BUSINESS</text><rect x="596" y="325" width="246" height="53" fill="#A8FF60" class="outline"/><text x="611" y="348" class="label">STATUS</text><text x="611" y="369" class="value">CAFFEINE-BOUND</text></g>
</svg>
