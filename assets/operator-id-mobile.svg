<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title description">
  <title id="title">inerthel-agi operator ID</title><desc id="description">Mobile operator card for inerthel-agi with an abstract Stealthy signal mark and four personal status panels.</desc>
