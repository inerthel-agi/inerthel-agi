<svg xmlns="http://www.w3.org/2000/svg" width="400" height="140" viewBox="0 0 400 140" role="img" aria-labelledby="t d">
  <title id="t">codex-whip</title>
  <desc id="d">Steers active Codex CLI and Desktop tasks from a Windows overlay.</desc>
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .in { animation: in .8s ease-out 0.60s both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x=".5" y=".5" width="399" height="139" rx="10" fill="#000" stroke="#262626"/>
  <g class="in">
    <text class="mono" x="22" y="34" fill="#6b6b6b" font-size="13">~/</text>
    <text class="sans" x="44" y="35" fill="#f2f2f2" font-size="19" font-weight="600">codex-whip</text>
    <text class="sans" x="22" y="68" fill="#9a9a9a" font-size="14">Steers active Codex CLI and Desktop</text>
