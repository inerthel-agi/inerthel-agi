<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Inerthel</title>
  <desc id="description">Inerthel profile banner: local software, automation and AI tools.</desc>
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .up { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: 2.6s; }
    .d4 { animation-delay: 2.8s; } .d5 { animation-delay: 3s; }
    .type { animation: type 2s steps(42) .9s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 56px 34px; }
    .draw { stroke-dasharray: 1800; animation: draw 2.2s ease-out .3s both; }
    .fill { animation: fade 1s ease-out 2s both; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes type { from { transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.6); } }
    @keyframes draw { from { stroke-dashoffset: 1800; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(380px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .scan { display: none; } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#141414"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37f5b0" stop-opacity="0"/>
      <stop offset="1" stop-color="#37f5b0" stop-opacity=".07"/>
    </linearGradient>
    <clipPath id="typed"><rect class="type" x="-474" y="200" width="548" height="40" transform="translate(548 0)"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#000"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect class="scan" width="1200" height="40" fill="url(#beam)"/>

    <path d="M48 58h1104M48 282h1104" stroke="#1c1c1c"/>
    <circle class="pulse" cx="56" cy="34" r="5" fill="#37f5b0"/>
    <g class="mono" fill="#6b6b6b" font-size="15" letter-spacing="2.5">
      <text x="72" y="39">ONLINE · IN / GITHUB</text>
      <text x="1152" y="39" text-anchor="end">INERTHEL.COM</text>
    </g>

    <text class="sans up d1" x="44" y="178" fill="#f5f5f5" font-size="112" font-weight="700" letter-spacing="-5">Inerthel</text>

    <g class="mono" font-size="20" letter-spacing="1">
      <text x="50" y="226" fill="#37f5b0">&gt;</text>
      <text x="74" y="226" fill="#bdbdbd" clip-path="url(#typed)">building tools that stay close to the user</text>
      <g class="type" transform="translate(548 0)">
        <rect class="cursor" x="76" y="210" width="11" height="20" fill="#37f5b0"/>
      </g>
    </g>

    <g class="mono" fill="#8a8a8a" font-size="15" letter-spacing="2.5">
      <text class="up d3" x="48" y="314">LOCAL SOFTWARE</text>
      <text class="up d4" x="394" y="314">AUTOMATION</text>
      <text class="up d5" x="735" y="314">AI TOOLS</text>
    </g>

    <rect x="920" y="88" width="232" height="164" rx="10" fill="#050505" stroke="#1c1c1c"/>
    <g transform="translate(947 104) scale(.27)">
      <path class="draw" d="M0 0h121v491H0zM163 0h104l284 383v108h-66L163 67zM428 0h123v491H428zM165 123l126 166v202H165z" fill="none" stroke="#37f5b0" stroke-width="6"/>
      <path class="fill" d="M0 0h121v491H0zM163 0h104l284 383v108h-66L163 67zM428 0h123v491H428zM165 123l126 166v202H165z" fill="#f5f5f5"/>
    </g>
  </g>
</svg>
