<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="title description">
  <title id="title">Inerthel</title>
  <desc id="description">Inerthel profile banner: local software, automation and AI tools.</desc>
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .up { animation: up .9s cubic-bezier(.2,.7,.2,1) .2s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 36px 34px; }
    .draw { stroke-dasharray: 1800; animation: draw 2.2s ease-out .3s both; }
    .fill { animation: fade 1s ease-out 2s both; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.6); } }
    @keyframes draw { from { stroke-dashoffset: 1800; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="620" height="420" rx="14" fill="#000"/>
  <path d="M30 58h560M30 362h560" stroke="#1c1c1c"/>
  <circle class="pulse" cx="36" cy="34" r="5" fill="#37f5b0"/>
  <g class="mono" fill="#6b6b6b" font-size="15" letter-spacing="2.5">
    <text x="52" y="39">ONLINE · IN / GITHUB</text>
    <text x="30" y="394">INERTHEL.COM</text>
  </g>
  <g transform="translate(34 88) scale(.17)">
    <path class="draw" d="M0 0h121v491H0zM163 0h104l284 383v108h-66L163 67zM428 0h123v491H428zM165 123l126 166v202H165z" fill="none" stroke="#37f5b0" stroke-width="8"/>
    <path class="fill" d="M0 0h121v491H0zM163 0h104l284 383v108h-66L163 67zM428 0h123v491H428zM165 123l126 166v202H165z" fill="#f5f5f5"/>
  </g>
  <text class="sans up" x="27" y="252" fill="#f5f5f5" font-size="91" font-weight="700" letter-spacing="-4">Inerthel</text>
  <g class="mono" font-size="19">
    <text x="32" y="302" fill="#bdbdbd"><tspan fill="#37f5b0">&gt;</tspan> local software · automation</text>
    <text x="32" y="334" fill="#bdbdbd"><tspan fill="#37f5b0">&gt;</tspan> ai tools</text>
    <rect class="cursor" x="148" y="318" width="10" height="19" fill="#37f5b0"/>
  </g>
</svg>
